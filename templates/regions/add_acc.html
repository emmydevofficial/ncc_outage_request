{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h3 class="page-title"> Add Area Control Center (ACC) </h3>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">ACCs</a></li>
        <li class="breadcrumb-item active" aria-current="page">Add Area Control Center</li>
      </ol>
    </nav>
  </div>

  <div class="col-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Area Control Center</h4>
        <p class="card-description"> Add New ACC </p>
        <form class="forms-sample" method="POST" action="{% url 'add_acc_post' %}">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label >Name</label>
                <input name="name" type="text" class="form-control" placeholder="Name">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label> State</label>
                <input name="state" type="text" class="form-control" placeholder="state">
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Address</label>
                <input name="address" type="text" class="form-control" placeholder="Address">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Email</label>
                <input name="email" type="text" class="form-control" placeholder="Email">
              </div>              
            </div>

            <div class="col-md-6">
              <div class="form-group">
                <label>Phone</label>
                <input name="phone" type="text" class="form-control" placeholder="Phone">
              </div>              
            </div>
          </div>
          
          <div class="row">
            <d0iv class="col-md-6">
              <div class="form-group">
                <label >Region</label>
                <select class="form-control" name="region">
                  {% for region in regions %}
                  <option value={{region.id}}>{{region.name}}</option>   
                  {% endfor %}               
                </select>
              </div>
            </d0iv>
            
            
          </div>          
          <button type="submit" class="btn btn-gradient-primary me-2">Add</button>
          <button class="btn btn-light">Cancel</button>
        </form>
      </div>
    </div>
  </div>

  {% endblock %}
