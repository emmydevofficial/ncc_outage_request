{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h3 class="page-title"> Edit Area Control Center (ACC) </h3>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">ACCs</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit Area Control Center</li>
        </ol>
    </nav>
</div>

<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Area Control Center</h4>
            <p class="card-description"> Edit ACC </p>
            
            <form class="forms-sample" method="POST" action="{% url 'edit_acc_post' acc.id %}">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Name</label>
                            <input name="name" type="text" class="form-control" value="{{ acc.name }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>State</label>
                            <input name="state" type="text" class="form-control" value="{{ acc.state }}" required>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Address</label>
                            <input name="address" type="text" class="form-control" value="{{ acc.location }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Email</label>
                            <input name="email" type="email" class="form-control" value="{{ acc.email }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Phone</label>
                            <input name="phone" type="text" class="form-control" value="{{ acc.phone_num }}" required>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Region</label>
                            <select class="form-control" name="region" required>
                                {% for region in regions %}
                                    <option value="{{ region.id }}" {% if acc.region.id == region.id %}selected{% endif %}>
                                        {{ region.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-gradient-primary me-2">Update</button>
                <a href="{% url 'all_accs' %}" class="btn btn-light">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
