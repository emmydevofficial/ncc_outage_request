<div class="table-responsive">
<table class="table table-sm table-responsive">
    <thead>
      <tr>
        <th>Timestamp</th><th>Request ID</th><th>User</th><th>Action</th><th>Message</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
        <tr>
          <td>{{ log.timestamp }}</td>
          <td>{{ log.request.request_id }}</td>
          <td>{{ log.user.username }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.message }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="5">No logs found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
