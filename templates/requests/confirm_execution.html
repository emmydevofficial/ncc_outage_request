{% extends 'base.html' %}
{% block content %}
<h3>Confirm Execution for {{ req.request_id }}</h3>
<form method="post" action="{% url 'confirm_execution' req.id %}">
  {% csrf_token %}
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="executed" id="executedCheck" {% if req.is_executed %}checked{% endif %}>
    <label class="form-check-label" for="executedCheck">
      Job Commenced
    </label>
  </div>
  <div class="mb-3">
    <label for="executionComment" class="form-label">Comment</label>
    {% if req.execution_comment %}
    <textarea class="form-control" id="executionComment" name="execution_comment" rows="4">{{ req.execution_comment }}</textarea>
    {% else %}
    <textarea class="form-control" id="executionComment" name="execution_comment" rows="4" placeholder="Service Note"></textarea>
    {% endif %}
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{% url 'view_request' req.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
